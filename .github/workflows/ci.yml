name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://gearflow:gearflow-ci-password@localhost:5432/gearflow_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gearflow
          POSTGRES_USER: gearflow
          POSTGRES_PASSWORD: gearflow-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearflow -d gearflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
