x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required}/gearflow-tools:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *database-environment
      NODE_ENV: production
    command: [npx, prisma, migrate, deploy, --schema, apps/api/prisma/schema.prisma]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  bootstrap-admin:
    profiles: [bootstrap]
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required}/gearflow-tools:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *database-environment
      NODE_ENV: production
    command: [npm, run, bootstrap:admin, --workspace=@gearflow/api]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required}/gearflow-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      <<: *database-environment
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD-SHELL,
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required}/gearflow-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://127.0.0.1/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
